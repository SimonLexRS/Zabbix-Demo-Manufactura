zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: '34c068451c7c48e7aa61e93402de9f6a'
      name: 'Templates/Manufacturing'
  templates:
    - uuid: 'beda92040f034ed19c75338af1dddf62'
      template: 'Planta Aceitera Demo by HTTP'
      name: 'Planta Aceitera Demo by HTTP'
      description: 'Gemelo digital de planta aceitera (acopio y molienda de soya). Datos obtenidos por HTTP agent desde /api/metrics. Fuente: https://github.com/SimonLexRS/Zabbix-Demo-Manufactura'
      groups:
        - name: 'Templates/Manufacturing'
      items:
        - uuid: '81eb0a4362b646ca8cf3ccb4a8ced1b6'
          name: 'Planta: datos crudos (/api/metrics)'
          type: 'HTTP_AGENT'
          key: 'planta.raw'
          delay: '{$PLANTA.INTERVAL}'
          history: '0'
          value_type: 'TEXT'
          trends: '0'
          url: '{$PLANTA.URL}/api/metrics'
          timeout: '10s'
          description: 'Ítem maestro: JSON completo del simulador. El resto de ítems son dependientes.'
          tags:
            - tag: 'component'
              value: 'raw'
        - uuid: '88f4376d8eec444eac38af47060393ce'
          name: 'Planta: reloj de simulación'
          type: 'DEPENDENT'
          key: 'planta.sim_minutes'
          delay: '0'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.sim_minutes'
          master_item:
            key: 'planta.raw'
          value_type: 'FLOAT'
          units: 'm'
          tags:
            - tag: 'component'
              value: 'general'
          triggers:
            - uuid: '6c09e097580c4230a9ce91e8912802d2'
              expression: 'nodata(/Planta Aceitera Demo by HTTP/planta.sim_minutes,{$PLANTA.NODATA})=1'
              name: 'Planta: sin datos del simulador'
              priority: 'AVERAGE'
              description: 'El endpoint /api/metrics no responde.'
        - uuid: '4d8b3f86537a4b54aab1a3375a64e315'
          name: 'Planta: velocidad de simulación'
          type: 'DEPENDENT'
          key: 'planta.speed'
          delay: '0'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.speed'
          master_item:
            key: 'planta.raw'
          value_type: 'FLOAT'
          units: 'x'
          tags:
            - tag: 'component'
              value: 'general'
        - uuid: '48233e4d2aea42bbb8a7d925c96cd4ac'
          name: 'Planta: fallas aleatorias habilitadas'
          type: 'DEPENDENT'
          key: 'planta.random_faults'
          delay: '0'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.random_faults'
          master_item:
            key: 'planta.raw'
          value_type: 'UNSIGNED'
          valuemap:
            name: 'Planta: sí/no'
          tags:
            - tag: 'component'
              value: 'general'
        - uuid: '0818f55a51ea46b7a8ac15490fae6d74'
