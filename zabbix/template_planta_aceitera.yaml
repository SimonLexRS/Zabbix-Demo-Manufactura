              priority: 'WARNING'
              tags:
                - tag: 'scope'
                  value: 'recepcion'
                - tag: 'symptom'
                  value: 'yes'
              dependencies:
                - name: 'Caída de red en balanza de ingreso ({ITEM.LASTVALUE})'
                  expression: 'last(/Planta Aceitera Demo by HTTP/planta.problem[bal_in_net])>0'
                - name: 'Caída de red en balanza de salida ({ITEM.LASTVALUE})'
                  expression: 'last(/Planta Aceitera Demo by HTTP/planta.problem[bal_out_net])>0'
                - name: 'Portería sin sistema de control ({ITEM.LASTVALUE})'
                  expression: 'last(/Planta Aceitera Demo by HTTP/planta.problem[gate_net])>0'
                - name: 'Calador automático fuera de servicio ({ITEM.LASTVALUE})'
                  expression: 'last(/Planta Aceitera Demo by HTTP/planta.problem[samp_fault])>0'
                - name: 'Atasco en Noria 1 ({ITEM.LASTVALUE})'
                  expression: 'last(/Planta Aceitera Demo by HTTP/planta.problem[noria_N1])>0'
                - name: 'Atasco en Noria 2 ({ITEM.LASTVALUE})'
                  expression: 'last(/Planta Aceitera Demo by HTTP/planta.problem[noria_N2])>0'
                - name: 'Colisión en vía interna ({ITEM.LASTVALUE})'
