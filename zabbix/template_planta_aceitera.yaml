zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 'aec574ac4232429b812cd13070e31732'
      name: 'Templates/Manufacturing'
  templates:
    - uuid: 'b79ac8066193474b95a13cf5b7c861f7'
      template: 'Planta Aceitera Demo by HTTP'
      name: 'Planta Aceitera Demo by HTTP'
      description: 'Monitoreo del gemelo digital de planta aceitera (acopio y molienda de soya). Fuente: https://github.com/SimonLexRS/Zabbix-Demo-Manufactura'
      groups:
        - name: 'Templates/Manufacturing'
      items:
        - uuid: '17255920ca764dc4a9609e387311bcc4'
          name: 'Planta: datos crudos (/api/metrics)'
          type: 'HTTP_AGENT'
          key: 'planta.raw'
          delay: '{$PLANTA.INTERVAL}'
          history: '0'
          value_type: 'TEXT'
          trends: '0'
          url: '{$PLANTA.URL}/api/metrics'
          timeout: '10s'
          description: 'Ítem maestro: JSON completo del simulador. El resto de ítems son dependientes.'
          tags:
            - tag: 'component'
              value: 'raw'
        - uuid: '44cf605440204d2fb4b1e28d8b7b789f'
          name: 'Planta: reloj de simulación'
          type: 'DEPENDENT'
          key: 'planta.sim_minutes'
          delay: '0'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.sim_minutes'
          master_item:
            key: 'planta.raw'
          value_type: 'FLOAT'
          units: 'm'
          tags:
            - tag: 'component'
              value: 'general'
          triggers:
            - uuid: '9a263bdf753d4a9fb62c5d6587632b37'
              expression: 'nodata(/Planta Aceitera Demo by HTTP/planta.sim_minutes,5m)=1'
              name: 'Sin datos de la planta por 5 minutos'
              priority: 'AVERAGE'
              description: 'El endpoint /api/metrics no responde o el servidor está detenido.'
        - uuid: '0e7cc09a14e94a6397eb50ce596e9211'
          name: 'Planta: velocidad de simulación'
          type: 'DEPENDENT'
