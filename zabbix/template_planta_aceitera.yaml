          description: 'Hexano residual máximo en harina (ppm).'
        - macro: '{$PLANTA.OIL.MAX}'
          value: '90'
          description: 'Ocupación máxima de tanques de aceite (%).'
        - macro: '{$PLANTA.ROADQ.MAX}'
          value: '4'
          description: 'Camiones máximos esperando en RN4.'
        - macro: '{$PLANTA.SILO.LEVEL.MAX}'
